<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0f">
<title>MuseDance</title>
<style>
:root {
    --bg: #0a0a0f;
    --bg-elev: #12121a;
    --bg-card: #1a1a24;
    --border: rgba(255,255,255,0.06);
    --border-hover: rgba(255,255,255,0.12);
    --text: #f5f5f7;
    --text-dim: #8a8a9a;
    --accent: #ffffff;
    --accent-hover: #d4d4d4;
    --danger: #ff3b30;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--text); font-size: 15px; -webkit-font-smoothing: antialiased; }

/* SVG иконки */
.icon { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 28px; height: 28px; }
.icon-xl { width: 36px; height: 36px; }

/* AUTH */
.auth-screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 1.5rem; z-index: 100; background: var(--bg); }
.auth-screen.hide { display: none; }
.auth-card { width: 100%; max-width: 400px; padding: 2.5rem 2rem; border: 1px solid var(--border); border-radius: 24px; background: var(--bg-elev); }
.auth-logo { text-align: center; margin-bottom: 2rem; }
.auth-logo h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.03em; }
.auth-logo p { color: var(--text-dim); font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; margin-top: 0.25rem; }

.btn-google { width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.6rem; background: #fff; color: #000; border: none; border-radius: 12px; padding: 0.9rem; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: all 0.15s; }
.btn-google:hover { background: #e8e8e8; }
.btn-google:disabled { opacity: 0.6; cursor: wait; }
.divider { display: flex; align-items: center; gap: 1rem; margin: 1.5rem 0; color: var(--text-dim); font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.tabs { display: flex; gap: 0.25rem; background: var(--bg-card); padding: 0.25rem; border-radius: 12px; margin-bottom: 1.25rem; }
.tab-btn { flex: 1; background: transparent; border: none; padding: 0.7rem; border-radius: 9px; font-weight: 600; font-size: 0.9rem; color: var(--text-dim); cursor: pointer; transition: all 0.15s; }
.tab-btn.active { background: var(--bg-elev); color: var(--text); }
.form { display: flex; flex-direction: column; gap: 0.75rem; }
.field { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 0.85rem 1rem; font-size: 0.95rem; color: var(--text); outline: none; transition: border-color 0.15s; width: 100%; }
.field:focus { border-color: var(--border-hover); }
.field::placeholder { color: var(--text-dim); }
.btn-primary { background: var(--accent); color: #000; border: none; border-radius: 12px; padding: 0.9rem; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: all 0.15s; margin-top: 0.25rem; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:disabled { opacity: 0.5; cursor: wait; }
.err, .ok { padding: 0.7rem 1rem; border-radius: 10px; font-size: 0.85rem; display: none; margin-bottom: 0.9rem; }
.err { background: rgba(255,59,48,0.1); border: 1px solid rgba(255,59,48,0.3); color: #ff8a80; }
.ok { background: rgba(52,199,89,0.1); border: 1px solid rgba(52,199,89,0.3); color: #8ce99a; }
.err.show, .ok.show { display: block; }
.auth-extra { text-align: center; margin-top: 1.25rem; font-size: 0.85rem; color: var(--text-dim); }
.auth-extra a { color: var(--text); cursor: pointer; text-decoration: none; }

/* APP */
.app { display: none; position: fixed; inset: 0; flex-direction: column; }
.app.show { display: flex; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem 0.75rem; flex-shrink: 0; }
.brand { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.02em; }
.top-right { display: flex; align-items: center; gap: 0.75rem; }
.user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--bg-card); display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 600; overflow: hidden; flex-shrink: 0; }
.user-avatar img { width: 100%; height: 100%; object-fit: cover; }
.icon-btn { background: transparent; border: none; color: var(--text-dim); padding: 0.4rem; cursor: pointer; border-radius: 8px; transition: all 0.15s; display: flex; align-items: center; justify-content: center; }
.icon-btn:hover { color: var(--text); background: var(--bg-card); }

.search-wrap { padding: 0 1.25rem 0.75rem; flex-shrink: 0; }
.search-input { width: 100%; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 0.7rem 1rem 0.7rem 2.75rem; font-size: 0.9rem; color: var(--text); outline: none; }
.search-input:focus { border-color: var(--border-hover); }
.search-input::placeholder { color: var(--text-dim); }
.search-wrap { position: relative; }
.search-icon { position: absolute; left: 1.85rem; top: 50%; transform: translateY(-50%); color: var(--text-dim); pointer-events: none; width: 16px; height: 16px; }

.app-tabs { display: flex; gap: 0.25rem; padding: 0 1.25rem 0.75rem; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; flex-shrink: 0; }
.app-tabs::-webkit-scrollbar { display: none; }
.app-tab { background: transparent; border: none; color: var(--text-dim); padding: 0.6rem 0.9rem; font-size: 0.85rem; font-weight: 600; cursor: pointer; border-radius: 8px; white-space: nowrap; transition: all 0.15s; }
.app-tab.active { color: var(--text); background: var(--bg-card); }

.content { flex: 1; overflow-y: auto; padding: 1rem 1.25rem 180px; scrollbar-width: thin; }
.content::-webkit-scrollbar { width: 6px; }
.content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.section-title { font-size: 0.75rem; font-weight: 700; color: var(--text-dim); letter-spacing: 0.12em; text-transform: uppercase; margin: 1.25rem 0 0.75rem; }
.section-title:first-child { margin-top: 0; }

.chips { display: flex; gap: 0.5rem; overflow-x: auto; scrollbar-width: none; margin-bottom: 0.5rem; padding-bottom: 0.25rem; }
.chips::-webkit-scrollbar { display: none; }
.chip { background: var(--bg-card); border: 1px solid var(--border); color: var(--text); padding: 0.55rem 1rem; border-radius: 20px; font-size: 0.85rem; font-weight: 500; cursor: pointer; white-space: nowrap; transition: all 0.15s; }
.chip:hover { border-color: var(--border-hover); }

.track { display: flex; align-items: center; gap: 0.9rem; padding: 0.5rem; border-radius: 10px; cursor: pointer; transition: background 0.15s; }
.track:hover { background: var(--bg-card); }
.track.playing .track-title { color: var(--text); }
.track.playing::before { content: ''; }
.track-cover { width: 48px; height: 48px; border-radius: 8px; overflow: hidden; background: var(--bg-card); flex-shrink: 0; position: relative; }
.track-cover img { width: 100%; height: 100%; object-fit: cover; }
.track-cover .play-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; color: #fff; }
.track:hover .play-overlay { display: flex; }
.track-info { flex: 1; min-width: 0; }
.track-title { font-size: 0.9rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.track-artist { font-size: 0.8rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 0.15rem; }
.track-actions { display: flex; align-items: center; gap: 0.15rem; }
.action-btn { background: transparent; border: none; color: var(--text-dim); padding: 0.5rem; cursor: pointer; border-radius: 8px; transition: all 0.15s; display: flex; align-items: center; justify-content: center; }
.action-btn:hover { color: var(--text); background: var(--bg-elev); }
.action-btn.liked { color: var(--danger); }
.action-btn.liked svg { fill: var(--danger); stroke: var(--danger); }

.empty-state { text-align: center; padding: 4rem 1rem; color: var(--text-dim); }
.empty-state h3 { font-size: 1rem; font-weight: 600; color: var(--text); margin-bottom: 0.5rem; }
.empty-state p { font-size: 0.85rem; }
.loading { text-align: center; padding: 3rem 1rem; color: var(--text-dim); font-size: 0.9rem; }

/* Wave hero */
.wave-hero { text-align: center; padding: 2.5rem 1rem 2rem; }
.wave-hero h2 { font-size: 2rem; font-weight: 700; letter-spacing: -0.04em; margin-bottom: 0.5rem; }
.wave-hero p { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 1.5rem; }
.wave-play { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: #000; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 0 auto 2rem; transition: transform 0.15s; }
.wave-play:hover { transform: scale(1.05); }
.wave-play svg { margin-left: 3px; }

/* PLAYLISTS */
.playlist-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
.playlist-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 1rem; cursor: pointer; transition: all 0.15s; }
.playlist-card:hover { border-color: var(--border-hover); }
.playlist-card-new { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 110px; border-style: dashed; color: var(--text-dim); }
.playlist-cover { width: 100%; aspect-ratio: 1; border-radius: 10px; background: var(--bg-elev); margin-bottom: 0.75rem; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.playlist-cover img { width: 100%; height: 100%; object-fit: cover; }
.playlist-name { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.playlist-count { font-size: 0.75rem; color: var(--text-dim); margin-top: 0.15rem; }

/* PLAYER (mini) */
.player-mini { position: fixed; left: 0.75rem; right: 0.75rem; bottom: calc(0.75rem + env(safe-area-inset-bottom)); background: rgba(26,26,36,0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 16px; padding: 0.6rem 0.75rem; display: none; align-items: center; gap: 0.75rem; cursor: pointer; z-index: 90; transition: transform 0.2s; }
.player-mini.show { display: flex; }
.player-mini:active { transform: scale(0.98); }
.player-mini-cover { width: 40px; height: 40px; border-radius: 8px; overflow: hidden; background: var(--bg-elev); flex-shrink: 0; }
.player-mini-cover img { width: 100%; height: 100%; object-fit: cover; }
.player-mini-info { flex: 1; min-width: 0; }
.player-mini-title { font-size: 0.85rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player-mini-artist { font-size: 0.75rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player-mini-controls { display: flex; align-items: center; gap: 0.25rem; }
.mini-btn { background: transparent; border: none; color: var(--text); padding: 0.4rem; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
.mini-btn:hover { background: var(--bg-elev); }
.player-mini-progress { position: absolute; bottom: 0; left: 0.75rem; right: 0.75rem; height: 2px; background: var(--border); border-radius: 1px; overflow: hidden; }
.player-mini-progress-fill { height: 100%; background: var(--text); width: 0%; transition: width 0.2s linear; }

/* PLAYER (fullscreen) */
.player-full { position: fixed; inset: 0; background: var(--bg); z-index: 200; display: flex; flex-direction: column; padding: 1rem; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1); }
.player-full.show { transform: translateY(0); }
.player-full.hidden-init { display: none; }
.player-full-top { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 0 1rem; flex-shrink: 0; }
.player-full-top .icon-btn { color: var(--text); }
.player-full-hero { flex: 1; display: flex; align-items: center; justify-content: center; padding: 1rem; min-height: 0; }
.player-full-cover { width: 100%; max-width: 380px; aspect-ratio: 1; border-radius: 16px; overflow: hidden; background: var(--bg-elev); box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
.player-full-cover img { width: 100%; height: 100%; object-fit: cover; }
.player-full-info { text-align: center; padding: 0.5rem 1rem 1rem; flex-shrink: 0; }
.player-full-title { font-size: 1.1rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player-full-artist { font-size: 0.85rem; color: var(--text-dim); margin-top: 0.25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.progress-row { display: flex; align-items: center; gap: 0.75rem; padding: 0 1rem 1rem; flex-shrink: 0; }
.progress-time { font-size: 0.7rem; color: var(--text-dim); font-variant-numeric: tabular-nums; min-width: 32px; }
.progress-full { flex: 1; height: 4px; background: var(--border); border-radius: 2px; cursor: pointer; position: relative; }
.progress-full-fill { height: 100%; background: var(--text); border-radius: 2px; width: 0%; }

.player-controls-full { display: flex; align-items: center; justify-content: center; gap: 1.5rem; padding: 0 1rem 1rem; flex-shrink: 0; }
.pc-btn { background: transparent; border: none; color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0.5rem; border-radius: 50%; transition: background 0.15s; }
.pc-btn:hover { background: var(--bg-card); }
.pc-play { width: 60px; height: 60px; background: var(--accent); color: #000; }
.pc-play:hover { background: var(--accent-hover); }

.player-bottom-row { display: flex; align-items: center; justify-content: space-between; padding: 0 1rem 0.5rem; flex-shrink: 0; }
.row-toggles { display: flex; align-items: center; gap: 0.25rem; }
.toggle-btn { background: transparent; border: none; color: var(--text-dim); padding: 0.5rem; cursor: pointer; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.toggle-btn.active { color: var(--text); }
.toggle-btn:hover { background: var(--bg-card); }
.volume-wrap { display: flex; align-items: center; gap: 0.5rem; flex: 1; max-width: 140px; }
.volume-slider { flex: 1; height: 3px; background: var(--border); border-radius: 2px; cursor: pointer; position: relative; }
.volume-fill { height: 100%; background: var(--text); border-radius: 2px; width: 80%; }

/* EQUALIZER PANEL */
.panel { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg-elev); border-top-left-radius: 20px; border-top-right-radius: 20px; z-index: 250; padding: 1.25rem 1.25rem calc(1.5rem + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1); max-height: 80vh; overflow-y: auto; }
.panel.show { transform: translateY(0); }
.panel-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 240; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.panel-backdrop.show { opacity: 1; pointer-events: auto; }
.panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
.panel-title { font-size: 1.1rem; font-weight: 700; }
.presets { display: flex; gap: 0.5rem; overflow-x: auto; scrollbar-width: none; margin-bottom: 1.25rem; padding-bottom: 0.25rem; }
.presets::-webkit-scrollbar { display: none; }
.preset-chip { background: var(--bg-card); border: 1px solid var(--border); color: var(--text); padding: 0.5rem 1rem; border-radius: 16px; font-size: 0.8rem; font-weight: 500; cursor: pointer; white-space: nowrap; transition: all 0.15s; }
.preset-chip.active { background: var(--accent); color: #000; border-color: var(--accent); }

.eq-bands { display: flex; justify-content: space-between; gap: 0.5rem; margin-bottom: 1rem; padding: 0 0.25rem; }
.eq-band { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
.eq-slider { -webkit-appearance: none; appearance: none; width: 100%; height: 140px; background: transparent; writing-mode: vertical-lr; direction: rtl; cursor: pointer; }
.eq-slider::-webkit-slider-runnable-track { width: 4px; background: var(--border); border-radius: 2px; }
.eq-slider::-moz-range-track { width: 4px; background: var(--border); border-radius: 2px; }
.eq-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; background: var(--text); border-radius: 50%; margin-left: -6px; cursor: pointer; }
.eq-slider::-moz-range-thumb { width: 16px; height: 16px; background: var(--text); border: none; border-radius: 50%; cursor: pointer; }
.eq-label { font-size: 0.7rem; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.eq-freq { font-size: 0.7rem; color: var(--text-dim); }
.eq-note { text-align: center; font-size: 0.75rem; color: var(--text-dim); margin-top: 1rem; padding: 0.75rem; background: var(--bg-card); border-radius: 10px; }
.eq-note strong { color: var(--text); }

/* MODAL */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.2s; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
.modal-backdrop.show { opacity: 1; pointer-events: auto; }
.modal { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; width: 100%; max-width: 380px; }
.modal h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; }
.modal p { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 1.25rem; }
.modal-list { max-height: 40vh; overflow-y: auto; margin-bottom: 1rem; }
.modal-item { padding: 0.75rem; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 0.75rem; }
.modal-item:hover { background: var(--bg-card); }
.modal-item-cover { width: 40px; height: 40px; border-radius: 8px; overflow: hidden; background: var(--bg-card); flex-shrink: 0; }
.modal-item-cover img { width: 100%; height: 100%; object-fit: cover; }
.modal-item-info { flex: 1; min-width: 0; }
.modal-item-name { font-size: 0.9rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.modal-item-count { font-size: 0.75rem; color: var(--text-dim); }
.modal-buttons { display: flex; gap: 0.5rem; }
.modal-btn { flex: 1; padding: 0.75rem; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.15s; border: none; }
.modal-btn-primary { background: var(--accent); color: #000; }
.modal-btn-primary:hover { background: var(--accent-hover); }
.modal-btn-secondary { background: var(--bg-card); color: var(--text); border: 1px solid var(--border); }
.modal-btn-secondary:hover { border-color: var(--border-hover); }

/* BREADCRUMB / back */
.back-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; }
.back-btn { background: transparent; border: none; color: var(--text-dim); cursor: pointer; display: flex; align-items: center; gap: 0.4rem; padding: 0.4rem 0.6rem 0.4rem 0; font-size: 0.85rem; }
.back-btn:hover { color: var(--text); }
.page-title { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 1rem; }

/* toast */
.toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(30,30,40,0.98); color: #fff; padding: 0.75rem 1.25rem; border-radius: 12px; font-size: 0.85rem; z-index: 400; opacity: 0; transition: all 0.25s; pointer-events: none; border: 1px solid var(--border); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (min-width: 700px) {
    .playlist-grid { grid-template-columns: repeat(3, 1fr); }
    .content { padding-left: 2rem; padding-right: 2rem; }
}
</style>
</head>
<body>

<!-- ============ AUTH SCREEN ============ -->
<div class="auth-screen" id="authScreen">
    <div class="auth-card">
        <div class="auth-logo">
            <h1>MuseDance</h1>
            <p>Music Player</p>
        </div>
        <button type="button" class="btn-google" id="googleBtn">
            <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.3C29.2 35 26.7 36 24 36c-5.2 0-9.6-3.1-11.3-7.7l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.3 5.3C41.6 35.7 44 30.4 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>
            <span>Продолжить с Google</span>
        </button>
        <div class="divider">или</div>
        <div class="tabs">
            <button class="tab-btn active" id="loginTab">Вход</button>
            <button class="tab-btn" id="registerTab">Регистрация</button>
        </div>
        <div class="err" id="errorMsg"></div>
        <div class="ok" id="successMsg"></div>
        <form class="form" id="loginForm">
            <input class="field" type="email" id="loginEmail" placeholder="Email" required>
            <input class="field" type="password" id="loginPassword" placeholder="Пароль" required>

// ============ DOM ============

let eqSettings = { flat: [0,0,0,0,0], pop: [-2,1,3,2,-1], rock: [3,1,-1,1,2], jazz: [2,1,0,1,2], classical: [0,0,0,-2,-3], bass: [5,3,0,0,0], vocal: [-2,0,3,2,1] };

// ============ AUTH ============
const showErr = t => { errorMsg.textContent = t; errorMsg.classList.add('show'); setTimeout(()=>errorMsg.classList.remove('show'), 5000); };

const setLoad = (b,on,txt='Загрузка') => { if(on){b.disabled=true;b.dataset.orig=b.innerHTML;b.innerHTML=txt+'...';}else{b.disabled=false;if(b.dataset.orig)b.innerHTML=b.dataset.orig;} };

function trErr(code) {
    const m = {
        'auth/email-already-in-use':'Email уже зарегистрирован',
        'auth/invalid-email':'Некорректный email',
        'auth/weak-password':'Пароль слишком слабый',
        'auth/user-not-found':'Пользователь не найден',
        'auth/wrong-password':'Неверный пароль',
        'auth/invalid-credential':'Неверный email или пароль',
        'auth/too-many-requests':'Слишком много попыток. Попробуйте позже',
        'auth/popup-blocked':'Попап заблокирован браузером',
        'auth/popup-closed-by-user':'Окно входа закрыто',
        'auth/unauthorized-domain':'Домен не авторизован',
        'auth/account-exists-with-different-credential':'Email используется другим способом'
    };
    return m[code] || code;
}

loginTab.onclick = () => { loginTab.classList.add('active'); registerTab.classList.remove('active'); loginForm.style.display='flex'; registerForm.style.display='none'; };
registerTab.onclick = () => { registerTab.classList.add('active'); loginTab.classList.remove('active'); loginForm.style.display='none'; registerForm.style.display='flex'; };

googleBtn.onclick = async () => { setLoad(googleBtn,true,'Открытие'); try{ await signInWithPopup(auth,googleProvider); } catch(e){ if(e.code!=='auth/popup-closed-by-user') showErr(trErr(e.code)); } finally { setLoad(googleBtn,false); } };

registerForm.onsubmit = async e => { e.preventDefault(); setLoad(registerBtn,true,'Создание');
    try { const c = await createUserWithEmailAndPassword(auth, $('registerEmail').value.trim(), $('registerPassword').value); await updateProfile(c.user,{displayName:$('registerName').value.trim()}); }
    catch(e){ showErr(trErr(e.code)); } finally { setLoad(registerBtn,false); } };

loginForm.onsubmit = async e => { e.preventDefault(); setLoad(loginBtn,true,'Вход');

    catch(e){ showErr(trErr(e.code)); } finally { setLoad(loginBtn,false); } };

    try { await sendPasswordResetEmail(auth, em.trim()); showOk('Письмо отправлено'); } catch(e){ showErr(trErr(e.code)); } };

onAuthStateChanged(auth, u => {
    if(u) {
        currentUser = u;
        authScreen.classList.add('hide');

        if(u.photoURL) av.innerHTML = `<img src="${u.photoURL}">`; else av.textContent = n[0].toUpperCase();
        loadAll();

        currentUser = null;
        authScreen.classList.remove('hide');
        appScreen.classList.remove('show');
        playerMini.classList.remove('show');
        playerFull.classList.remove('show');
        loginForm.reset(); registerForm.reset();
        stopProgress();
    }
});

// ============ FIREBASE DATA ============
async function loadAll() {
    await Promise.all([loadLikes(), loadPlaylists(), loadHistory(), loadEqSettings()]);
    renderView('wave');
}

async function loadLikes() {
    try {
        const snap = await getDocs(collection(db,'users',currentUser.uid,'likes'));
        likedIds.clear(); likedData = {};
        snap.forEach(d => { likedIds.add(d.id); likedData[d.id] = d.data(); });
    } catch(e){ console.warn('likes load', e); }
}

async function loadPlaylists() {
    try {
        const snap = await getDocs(collection(db,'users',currentUser.uid,'playlists'));
        playlists = {};
        snap.forEach(d => { playlists[d.id] = d.data(); });
    } catch(e){ console.warn('playlists load', e); }
}

async function loadHistory() {
    try {
        const snap = await getDocs(query(collection(db,'users',currentUser.uid,'history'), orderBy('playedAt','desc'), limit(50)));
        history = [];
        snap.forEach(d => history.push(d.data()));
    } catch(e){ console.warn('history load', e); }
}

async function loadEqSettings() {
    try {
        const ref = doc(db,'users',currentUser.uid,'settings','eq');
        const s = await getDoc(ref);
        if(s.exists()) {
            const d = s.data();
            currentPreset = d.preset || 'flat';
            currentEqValues = d.values || [0,0,0,0,0];
        }
    } catch(e){ console.warn('eq load', e); }
}

async function saveEqSettings() {
    try {
        await setDoc(doc(db,'users',currentUser.uid,'settings','eq'), { preset: currentPreset, values: currentEqValues });
    } catch(e){ console.warn('eq save', e); }
}

async function logPlay(track) {
    if(!currentUser) return;
    try {
        const id = track.id;
        await setDoc(doc(db,'users',currentUser.uid,'history',id), {
            id: track.id, title: track.title, artist: track.artist, thumb: track.thumb, playedAt: Date.now()
        });
        // обновить локальную историю
        history = history.filter(h => h.id !== id);
        history.unshift({ id: track.id, title: track.title, artist: track.artist, thumb: track.thumb, playedAt: Date.now() });
        if(history.length > 50) history = history.slice(0,50);
    } catch(e){ console.warn('log history', e); }
}

async function toggleLike(track, btnEl) {
    if(!currentUser) return;
    try {
        if(likedIds.has(track.id)) {
            await deleteDoc(doc(db,'users',currentUser.uid,'likes',track.id));
            likedIds.delete(track.id); delete likedData[track.id];
            if(btnEl) { btnEl.classList.remove('liked'); btnEl.innerHTML = heartSvg; }
            updateLikeCurrentBtn();
        } else {
            const data = { id: track.id, title: track.title, artist: track.artist, thumb: track.thumb, likedAt: Date.now() };
            await setDoc(doc(db,'users',currentUser.uid,'likes',track.id), data);
            likedIds.add(track.id); likedData[track.id] = data;
            if(btnEl) { btnEl.classList.add('liked'); btnEl.innerHTML = heartFillSvg; }
            updateLikeCurrentBtn();
        }
        if(currentView === 'likes') renderView('likes');
    } catch(e){ console.error(e); showToast('Не удалось сохранить лайк'); }
}

function updateLikeCurrentBtn() {
    const t = currentTracks[currentIndex];
    if(t && likedIds.has(t.id)) {
        likeCurrentBtn.classList.add('liked');
        likeCurrentBtn.innerHTML = heartFillSvg;
    } else {
        likeCurrentBtn.classList.remove('liked');
        likeCurrentBtn.innerHTML = heartSvg;
    }
}

// ============ SVG ============
const heartSvg = '<svg class="icon" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';
const heartFillSvg = '<svg class="icon" viewBox="0 0 24 24" style="fill:currentColor;"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';
const playSvg = '<svg class="icon" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3" fill="currentColor" stroke="none"/></svg>';
const pauseSvg = '<svg class="icon" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" fill="currentColor" stroke="none"/><rect x="14" y="4" width="4" height="16" fill="currentColor" stroke="none"/></svg>';
const moreSvg = '<svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="5" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg>';
const plusSvg = '<svg class="icon icon-sm" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';

// ============ YOUTUBE ============
function loadYTAPI(cb) {
    if(window.YT && window.YT.Player) return cb();
    window.onYouTubeIframeAPIReady = cb;
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
}

loadYTAPI(() => {
    ytPlayer = new YT.Player('yt-container', {
        height: '1', width: '1', videoId: '',
        playerVars: { autoplay: 0, controls: 0, disablekb: 1, fs: 0, modestbranding: 1, rel: 0 },
        events: {
            onReady: () => { ytReady = true; },
            onStateChange: e => {
                if(e.data === YT.PlayerState.PLAYING) { isPlaying = true; updatePlayIcons(); startProgress(); }
                else if(e.data === YT.PlayerState.PAUSED) { isPlaying = false; updatePlayIcons(); }
                else if(e.data === YT.PlayerState.ENDED) { nextTrack(); }
            }
        }
    });
});

function updatePlayIcons() {
    miniPlayIcon.outerHTML = isPlaying ? pauseSvg.replace('class="icon"','class="icon" id="miniPlayIcon"') : playSvg.replace('class="icon"','class="icon" id="miniPlayIcon"');
    fullPlayIcon.outerHTML = isPlaying ? pauseSvg.replace('class="icon icon-lg"','class="icon icon-lg" id="fullPlayIcon"') : playSvg.replace('class="icon icon-lg"','class="icon icon-lg" id="fullPlayIcon"');
    // re-attach
    setTimeout(()=>{ $('miniPlayIcon') && ($('miniPlayIcon').parentElement.onclick = togglePlay); $('fullPlayIcon') && ($('fullPlayIcon').parentElement.onclick = togglePlay); }, 0);
}

async function ytSearch(q, maxResults=25) {
    const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoCategoryId=10&maxResults=${maxResults}&q=${encodeURIComponent(q)}&key=${YOUTUBE_API_KEY}`;
    const r = await fetch(url);
    if(!r.ok) { const e = await r.json(); throw new Error(e.error?.message || 'YouTube API error'); }
    const d = await r.json();
    return (d.items||[]).map(it => ({
        id: it.id.videoId,
        title: it.snippet.title,
        artist: it.snippet.channelTitle,
        thumb: it.snippet.thumbnails?.medium?.url || it.snippet.thumbnails?.default?.url || ''
    }));
}

    t.onclick = () => { setActiveTab(t.dataset.view); renderView(t.dataset.view); };
});

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderView(view) {
    content.innerHTML = '';
    content.scrollTop = 0;
    if(view === 'wave') renderWave();
    else if(view === 'discover') renderDiscover();
    else if(view === 'playlists') renderPlaylists();
    else if(view === 'likes') renderLikes();
}

function trackHTML(t, opts={}) {
    const liked = likedIds.has(t.id);
    const isPlaying = currentTracks[currentIndex]?.id === t.id;
    return `<div class="track ${isPlaying?'playing':''}" data-track-id="${t.id}">
        <div class="track-cover">
            ${t.thumb ? `<img src="${t.thumb}" loading="lazy">` : ''}
            <div class="play-overlay">${playSvg}</div>
        </div>
        <div class="track-info">
            <div class="track-title">${esc(t.title)}</div>
            <div class="track-artist">${esc(t.artist)}</div>
        </div>
        <div class="track-actions">
            ${opts.hideAdd ? '' : `<button class="action-btn add-playlist-btn" data-track-id="${t.id}" title="В плейлист">${plusSvg}</button>`}
            <button class="action-btn like-btn ${liked?'liked':''}" data-track-id="${t.id}" title="Лайк">${liked?heartFillSvg:heartSvg}</button>
        </div>
    </div>`;
}

function bindTrackEvents(container, list) {
    container.querySelectorAll('.track').forEach(el => {
        const id = el.dataset.trackId;
        const track = list.find(t => t.id === id);
        if(!track) return;
        el.querySelector('.track-cover').onclick = () => playTrack(list, list.indexOf(track));
        el.querySelector('.track-info').onclick = () => playTrack(list, list.indexOf(track));
        const likeBtn = el.querySelector('.like-btn');
        if(likeBtn) likeBtn.onclick = e => { e.stopPropagation(); toggleLike(track, likeBtn); };
        const addBtn = el.querySelector('.add-playlist-btn');
        if(addBtn) addBtn.onclick = e => { e.stopPropagation(); openAddToPlaylist(track); };
    });
}

// ============ WAVE ("Моя волна") ============
async function renderWave() {
    content.innerHTML = `
        <div class="wave-hero">
            <h2>Моя волна</h2>
            <p>Персональные рекомендации на основе ваших лайков и истории</p>
            <button class="wave-play" id="wavePlayBtn">${playSvg.replace('class="icon"','class="icon icon-lg"')}</button>
        </div>
        <div id="waveTracks"><div class="loading">Собираем рекомендации...</div></div>
    `;
    $('wavePlayBtn').onclick = () => { if(currentTracks.length) playTrack(currentTracks, 0); };

    try {
        const tracks = await buildWave();
        currentTracks = tracks;
        const el = $('waveTracks');
        if(!tracks.length) {
            el.innerHTML = `<div class="empty-state"><h3>Волна пока пустая</h3><p>Слушайте треки и ставьте лайки — мы подберём музыку под вас</p></div>`;
            return;
        }
        el.innerHTML = tracks.map(t => trackHTML(t)).join('');
        bindTrackEvents(el, tracks);
    } catch(e) {
        console.error(e);
        $('waveTracks').innerHTML = `<div class="empty-state"><h3>Не удалось собрать волну</h3><p>Попробуйте позже</p></div>`;
    }
}

async function buildWave() {
    // Собираем seeds: лайки + история
    const likedList = Object.values(likedData);
    const seeds = [...likedList, ...history].slice(0, 10);
    if(seeds.length === 0) {
        // новому юзеру — популярное
        return await ytSearch('популярная музыка 2024', 25);
    }
    // Берём каналы и слова из названий
    const channels = [...new Set(seeds.map(s => s.artist).filter(Boolean))].slice(0, 4);
    const words = seeds.flatMap(s => (s.title||'').split(/\s+/).filter(w => w.length > 3)).slice(0, 8);
    const queries = [
        ...channels.map(c => `${c} лучшие песни`),
        words.length ? words.slice(0,3).join(' ') : 'популярная музыка'
    ];
    // Запрашиваем по каждому сиду
    const results = await Promise.all(queries.map(q => ytSearch(q, 10).catch(()=>[])));
    const flat = results.flat();
    // Уникализация
    const seen = new Set();
    const unique = flat.filter(t => { if(seen.has(t.id)) return false; seen.add(t.id); return true; });
    // Исключаем уже прослушанное (только что)
    const recentIds = new Set(seeds.map(s => s.id));
    const filtered = unique.filter(t => !recentIds.has(t.id));
    // Перемешиваем
    return filtered.sort(() => Math.random() - 0.5).slice(0, 30);
}

// ============ DISCOVER ============
async function renderDiscover() {
    content.innerHTML = `
        <div class="section-title">Жанры и подборки</div>
        <div class="chips" id="chips"></div>
        <div id="discoverTracks"><div class="loading">Загрузка...</div></div>
    `;
    const genres = [
        {label:'Красное дерево', q:'Красное дерево'},
        {label:'Русский рок', q:'русский рок хиты'},
        {label:'Русский рэп', q:'русский рэп 2024'},
        {label:'Кино', q:'группа Кино'},
        {label:'ДДТ', q:'ДДТ'},
        {label:'Баста', q:'Баста'},
        {label:'Lo-Fi', q:'lofi beats'},
        {label:'Jazz', q:'jazz music'},
        {label:'Классика', q:'classical music'},
        {label:'Ретро', q:'советская эстрада'}
    ];
    const chipsEl = $('chips');
    chipsEl.innerHTML = genres.map(g => `<button class="chip" data-q="${esc(g.q)}">${esc(g.label)}</button>`).join('');
    chipsEl.querySelectorAll('.chip').forEach(c => {
        c.onclick = () => { chipsEl.querySelectorAll('.chip').forEach(x=>x.classList.remove('active')); c.classList.add('active'); loadDiscoverTracks(c.dataset.q, c.textContent); };
    });

    chipsEl.querySelector('.chip').classList.add('active');

}

async function loadDiscoverTracks(q, label) {
    const el = $('discoverTracks');
    el.innerHTML = '<div class="loading">Загрузка...</div>';
    try {
        const tracks = await ytSearch(q, 25);
        currentTracks = tracks;
        if(!tracks.length) { el.innerHTML = '<div class="empty-state"><h3>Ничего не найдено</h3></div>'; return; }
        el.innerHTML = tracks.map(t => trackHTML(t)).join('');
        bindTrackEvents(el, tracks);
    } catch(e) {
        console.error(e);
        el.innerHTML = `<div class="empty-state"><h3>Ошибка загрузки</h3><p>${esc(e.message)}</p></div>`;
    }
}

// ============ PLAYLISTS ============
function renderPlaylists() {
    content.innerHTML = `
        <div class="page-title">Плейлисты</div>
        <div class="playlist-grid" id="playlistGrid"></div>
    `;
    const grid = $('playlistGrid');
    const items = Object.entries(playlists).map(([id, p]) => {
        const cover = p.cover || (p.tracks?.[0]?.thumb) || '';
        return `<div class="playlist-card" data-playlist-id="${id}">
            <div class="playlist-cover">${cover?`<img src="${cover}">`:plusSvg.replace('class="icon icon-sm"','class="icon icon-lg" style="color:var(--text-dim)"')}</div>
            <div class="playlist-name">${esc(p.name)}</div>
            <div class="playlist-count">${(p.tracks||[]).length} треков</div>
        </div>`;
    }).join('');
    const newCard = `<div class="playlist-card playlist-card-new" id="newPlaylistCard">${plusSvg.replace('class="icon icon-sm"','class="icon icon-lg"')}<div style="margin-top:0.5rem;font-size:0.85rem;">Новый плейлист</div></div>`;
    grid.innerHTML = items + newCard;

    $('newPlaylistCard').onclick = createNewPlaylist;
    grid.querySelectorAll('[data-playlist-id]').forEach(c => {
        c.onclick = () => openPlaylist(c.dataset.playlistId);
    });
}

async function createNewPlaylist() {
    const name = prompt('Название плейлиста:');
    if(!name || !name.trim()) return;
    try {
        const ref = await addDoc(collection(db,'users',currentUser.uid,'playlists'), { name: name.trim(), tracks: [], createdAt: Date.now() });
        playlists[ref.id] = { name: name.trim(), tracks: [] };
        showToast('Плейлист создан');
        renderPlaylists();
    } catch(e) { console.error(e); showToast('Ошибка создания'); }
}

function openPlaylist(id) {
    const p = playlists[id];
    if(!p) return;
    content.innerHTML = `
        <div class="back-row"><button class="back-btn" id="backBtn">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg> Назад
        </button></div>
        <div class="page-title">${esc(p.name)}</div>
        <div id="playlistTracks"></div>
    `;
    $('backBtn').onclick = () => renderView('playlists');
    const el = $('playlistTracks');
    const tracks = p.tracks || [];
    if(!tracks.length) {
        el.innerHTML = `<div class="empty-state"><h3>Плейлист пуст</h3><p>Добавьте треки через значок + на любом треке</p></div>`;
        return;
    }
    currentTracks = tracks;
    el.innerHTML = tracks.map(t => trackHTML(t, {hideAdd:true})).join('');
    bindTrackEvents(el, tracks);
}

function openAddToPlaylist(track) {
    addingTrackToPlaylist = track;
    modalTrackName.textContent = track.title;
    const list = Object.entries(playlists);
    if(!list.length) {
        modalPlaylists.innerHTML = `<div style="padding:1rem;text-align:center;color:var(--text-dim);font-size:0.85rem;">Нет плейлистов. Создайте первый.</div>`;
    } else {
        modalPlaylists.innerHTML = list.map(([id, p]) => `
            <div class="modal-item" data-playlist-id="${id}">
                <div class="modal-item-cover">${p.cover?`<img src="${p.cover}">`:(p.tracks?.[0]?.thumb?`<img src="${p.tracks[0].thumb}">`:plusSvg)}</div>
                <div class="modal-item-info">
                    <div class="modal-item-name">${esc(p.name)}</div>
                    <div class="modal-item-count">${(p.tracks||[]).length} треков</div>
                </div>
            </div>
        `).join('');
        modalPlaylists.querySelectorAll('.modal-item').forEach(el => {
            el.onclick = () => addTrackToPlaylist(el.dataset.playlistId, track);
        });
    }
    modalBackdrop.classList.add('show');
}

async function addTrackToPlaylist(playlistId, track) {
    try {
        const p = playlists[playlistId];
        if(!p) return;
        if((p.tracks||[]).find(t => t.id === track.id)) { showToast('Уже в плейлисте'); modalBackdrop.classList.remove('show'); return; }
        p.tracks = [...(p.tracks||[]), track];
        if(!p.cover && track.thumb) p.cover = track.thumb;
        await setDoc(doc(db,'users',currentUser.uid,'playlists',playlistId), p);
        showToast('Добавлено в ' + p.name);
        modalBackdrop.classList.remove('show');
    } catch(e) { console.error(e); showToast('Ошибка'); }
}

$('modalCancel').onclick = () => modalBackdrop.classList.remove('show');
$('modalNewPlaylist').onclick = async () => {
    const name = prompt('Название плейлиста:');
    if(!name || !name.trim()) return;
    try {
        const ref = await addDoc(collection(db,'users',currentUser.uid,'playlists'), { name: name.trim(), tracks: [], createdAt: Date.now() });
        playlists[ref.id] = { name: name.trim(), tracks: [] };
        if(addingTrackToPlaylist) await addTrackToPlaylist(ref.id, addingTrackToPlaylist);
    } catch(e) { console.error(e); showToast('Ошибка'); }
};
modalBackdrop.onclick = e => { if(e.target === modalBackdrop) modalBackdrop.classList.remove('show'); };

// ============ LIKES ============
function renderLikes() {
    content.innerHTML = `
        <div class="page-title">Мои лайки</div>
        <div id="likedTracks"></div>
    `;
    const el = $('likedTracks');
    const tracks = Object.values(likedData).sort((a,b)=>b.likedAt-a.likedAt);
    if(!tracks.length) {
        el.innerHTML = `<div class="empty-state"><h3>Пока нет лайков</h3><p>Нажмите на сердечко на любом треке</p></div>`;
        return;
    }
    currentTracks = tracks;
    el.innerHTML = tracks.map(t => trackHTML(t)).join('');

// ============ SEARCH ============
let searchTimer = null;
searchInput.oninput = () => {
    clearTimeout(searchTimer);
    const q = searchInput.value.trim();
    if(!q) { renderView(currentView); return; }
    searchTimer = setTimeout(async () => {
        content.innerHTML = `
            <div class="page-title">Поиск: ${esc(q)}</div>
            <div id="searchResults"><div class="loading">Поиск...</div></div>
        `;
        try {
            const tracks = await ytSearch(q, 25);
            currentTracks = tracks;
            const el = $('searchResults');
            if(!tracks.length) { el.innerHTML = '<div class="empty-state"><h3>Ничего не найдено</h3></div>'; return; }
            el.innerHTML = tracks.map(t => trackHTML(t)).join('');
            bindTrackEvents(el, tracks);
        } catch(e) {
            console.error(e);
            $('searchResults').innerHTML = `<div class="empty-state"><h3>Ошибка поиска</h3><p>${esc(e.message)}</p></div>`;
        }
    }, 500);
};

// ============ PLAYER ============
function playTrack(list, idx) {
    currentTracks = list;
    currentIndex = idx;
    const t = list[idx];
    if(!t) return;
    miniCover.innerHTML = t.thumb ? `<img src="${t.thumb}">` : '';
    miniTitle.textContent = t.title;
    miniArtist.textContent = t.artist;
    fullCover.innerHTML = t.thumb ? `<img src="${t.thumb}">` : '';
    fullTitle.textContent = t.title;
    fullArtist.textContent = t.artist;
    playerMini.classList.add('show');
    playerFull.classList.remove('hidden-init');
    updateLikeCurrentBtn();
    if(ytReady && ytPlayer) {
        ytPlayer.loadVideoById(t.id);
        ytPlayer.setVolume(currentVolume);
    } else {
        setTimeout(() => playTrack(list, idx), 400);
    }
    logPlay(t);
}

function togglePlay() {
    if(!ytPlayer) return;
    if(isPlaying) ytPlayer.pauseVideo(); else ytPlayer.playVideo();
}

function nextTrack() {
    if(currentIndex < currentTracks.length - 1) playTrack(currentTracks, currentIndex + 1);
    else playTrack(currentTracks, 0);
}
function prevTrack() {
    if(currentIndex > 0) playTrack(currentTracks, currentIndex - 1);
    else playTrack(currentTracks, currentTracks.length - 1);
}

function startProgress() {
    stopProgress();
    progressTimer = setInterval(() => {
        if(!ytPlayer || !ytPlayer.getCurrentTime) return;
        const pos = ytPlayer.getCurrentTime() || 0;
        currentDuration = ytPlayer.getDuration() || 0;
        if(currentDuration > 0) {
            const pct = Math.min(100, (pos/currentDuration)*100);
            miniProgress.style.width = pct + '%';
            fullProgressFill.style.width = pct + '%';
            fullCurrent.textContent = fmt(pos);
            fullDuration.textContent = fmt(currentDuration);
        }
    }, 500);
}
function stopProgress() { if(progressTimer){ clearInterval(progressTimer); progressTimer=null; } }
function fmt(s) { s = Math.floor(s||0); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }

// mini player events
$('miniPrev').onclick = e => { e.stopPropagation(); prevTrack(); };
$('miniNext').onclick = e => { e.stopPropagation(); nextTrack(); };
$('miniPlay').onclick = e => { e.stopPropagation(); togglePlay(); };
playerMini.onclick = e => { if(e.target.closest('button')) return; playerFull.classList.add('show'); };

// full player events
$('closeFullPlayer').onclick = () => playerFull.classList.remove('show');
$('fullPrev').onclick = prevTrack;
$('fullNext').onclick = nextTrack;
$('fullPlay').onclick = togglePlay;
likeCurrentBtn.onclick = () => { const t = currentTracks[currentIndex]; if(t) toggleLike(t, null); };
$('addToPlaylistBtn').onclick = () => { const t = currentTracks[currentIndex]; if(t) openAddToPlaylist(t); };

fullProgressWrap.onclick = e => {
    if(!ytPlayer || !currentDuration) return;
    const r = fullProgressWrap.getBoundingClientRect();
    ytPlayer.seekTo(((e.clientX - r.left) / r.width) * currentDuration, true);
};

// volume
volumeSlider.onclick = e => {
    const r = volumeSlider.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    currentVolume = Math.round(pct * 100);
    volumeFill.style.width = currentVolume + '%';
    if(ytPlayer && ytPlayer.setVolume) ytPlayer.setVolume(currentVolume);
};

// ============ EQUALIZER ============
function buildEqBands() {
    eqBands.innerHTML = EQ_FREQS.map((f,i) => `
        <div class="eq-band">
            <input type="range" class="eq-slider" min="-12" max="12" step="1" value="${currentEqValues[i]||0}" data-band="${i}" orient="vertical">
            <div class="eq-label" id="eqVal${i}">${(currentEqValues[i]||0)>0?'+':''}${currentEqValues[i]||0}dB</div>
            <div class="eq-freq">${f}</div>
        </div>
    `).join('');
    eqBands.querySelectorAll('.eq-slider').forEach(s => {
        s.oninput = () => {
            const i = +s.dataset.band;
            currentEqValues[i] = +s.value;
            $('eqVal'+i).textContent = (s.value>0?'+':'') + s.value + 'dB';
            currentPreset = 'custom';
            document.querySelectorAll('.preset-chip').forEach(c => c.classList.remove('active'));
        };
        s.onchange = () => { saveEqSettings(); };
    });
}

function applyPreset(preset) {
    currentPreset = preset;
    currentEqValues = [...eqSettings[preset]];
    buildEqBands();
    saveEqSettings();
    document.querySelectorAll('.preset-chip').forEach(c => c.classList.toggle('active', c.dataset.preset === preset));
}

$('eqBtn').onclick = () => { buildEqBands(); eqPanel.classList.add('show'); panelBackdrop.classList.add('show'); };
$('closeEqPanel').onclick = () => { eqPanel.classList.remove('show'); panelBackdrop.classList.remove('show'); };
panelBackdrop.onclick = () => { eqPanel.classList.remove('show'); panelBackdrop.classList.remove('show'); };

document.querySelectorAll('.preset-chip').forEach(c => {
    c.onclick = () => applyPreset(c.dataset.preset);
    if(c.dataset.preset === currentPreset) c.classList.add('active');
});
</script>
