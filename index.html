<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuseDance · Вход и регистрация</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 20% 30%, #1e1e2f, #0b0b12);
            padding: 1.5rem;
            color: #fff;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 70% 80%, rgba(168, 85, 247, 0.2), transparent 50%),
                        radial-gradient(circle at 20% 20%, rgba(6, 182, 212, 0.2), transparent 55%);
            pointer-events: none;
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 440px;
            background: rgba(18, 18, 28, 0.85);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 2.5rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.8),
                        0 0 0 1px rgba(255, 255, 255, 0.04) inset,
                        0 0 40px rgba(168, 85, 247, 0.2);
        }

        .logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2rem;
        }

        .logo-icon {
            font-size: 3rem;
            line-height: 1;
            margin-bottom: 0.5rem;
            filter: drop-shadow(0 0 16px rgba(168, 85, 247, 0.8));
        }

        .logo-text {
            font-size: 1.9rem;
            font-weight: 700;
            background: linear-gradient(to right, #e2e8f0, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-sub {
            font-size: 0.8rem;
            color: #9ca3af;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            margin-top: 0.3rem;
        }

        /* Google-кнопка */
        .btn-google {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            background: #ffffff;
            color: #1f1f1f;
            border: none;
            border-radius: 3rem;
            padding: 1rem;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
            margin-bottom: 1.25rem;
        }

        .btn-google:hover:not(:disabled) {
            transform: translateY(-2px);
            background: #f7f7f7;
            box-shadow: 0 10px 24px rgba(255, 255, 255, 0.15);
        }

        .btn-google:disabled {
            opacity: 0.7;
            cursor: wait;
        }

        .btn-google svg {
            flex-shrink: 0;
        }

        /* Разделитель «или» */
        .divider {
            display: flex;
            align-items: center;
            gap: 0.9rem;
            margin: 1.4rem 0 1.4rem;
            color: #6b7280;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 500;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.12), transparent);
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            background: rgba(0, 0, 0, 0.4);
            padding: 0.35rem;
            border-radius: 3rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.85rem 0.5rem;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 1rem;
            color: #9aa2b1;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            color: white;
            box-shadow: 0 8px 18px -6px #a855f7;
        }

        .tab-btn:hover:not(.active) {
            color: #d1d5db;
            background: rgba(255, 255, 255, 0.03);
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 1.15rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .input-group label {
            font-size: 0.8rem;
            font-weight: 500;
            color: #9ca3af;
            padding-left: 0.75rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            font-size: 1.1rem;
            opacity: 0.5;
            color: #a78bfa;
            pointer-events: none;
        }

        .input-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1.5px solid rgba(255, 255, 255, 0.07);
            border-radius: 2rem;
            padding: 0.9rem 1rem 0.9rem 2.8rem;
            font-size: 0.95rem;
            color: #f0f4ff;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-group input::placeholder {
            color: #6b7280;
        }

        .input-group input:focus {
            border-color: #a855f7;
            background: rgba(20, 15, 35, 0.8);
            box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.15);
        }

        .btn-primary {
            margin-top: 0.4rem;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            border: none;
            border-radius: 3rem;
            padding: 1rem;
            font-weight: 700;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 12px 24px -8px #a855f7;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 18px 28px -8px #a855f7;
            filter: brightness(1.1);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .btn-secondary {
            background: transparent;
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 3rem;
            padding: 0.9rem;
            font-weight: 600;
            font-size: 0.95rem;
            color: #d1d5db;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .error-msg, .success-msg {
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            font-size: 0.85rem;
            display: none;
            margin-bottom: 1rem;
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            animation: shake 0.3s ease;
        }

        .success-msg {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #86efac;
        }

        .error-msg.show, .success-msg.show {
            display: block;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .extra {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #9ca3af;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1.25rem;
        }

        .extra a {
            color: #c084fc;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }

        .extra a:hover {
            color: #e0aaff;
            text-decoration: underline;
        }

        #registerForm {
            display: none;
        }

        /* Экран плеера */
        #playerScreen {
            display: none;
            text-align: center;
        }

        .user-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            margin: 0 auto 1rem;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.6);
            overflow: hidden;
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .greeting {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
        }

        .user-email {
            color: #9ca3af;
            font-size: 0.85rem;
            margin-bottom: 2rem;
        }

        .provider-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.35rem 0.85rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            color: #cbd5e1;
            margin-bottom: 1.25rem;
        }

        .player-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 1.5rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .player-track {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
        }

        .player-artist {
            color: #9ca3af;
            font-size: 0.85rem;
            margin-bottom: 1.2rem;
        }

        .player-progress {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .player-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #a855f7, #3b82f6);
            border-radius: 2px;
            animation: progress 8s linear infinite;
        }

        @keyframes progress {
            from { width: 0%; }
            to { width: 100%; }
        }

        .player-controls {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            font-size: 1.5rem;
        }

        .player-controls span {
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .player-controls span:hover {
            opacity: 1;
        }

        @media (max-width: 450px) {
            .card {
                padding: 2rem 1.25rem;
                border-radius: 2rem;
            }
            .logo-text { font-size: 1.6rem; }
            .tab-btn { font-size: 0.9rem; padding: 0.7rem 0.2rem; }
        }
    </style>
</head>
<body>

    <!-- ЭКРАН АВТОРИЗАЦИИ -->
    <div class="card" id="authScreen">
        <div class="logo">
            <div class="logo-icon">🎵</div>
            <div class="logo-text">MuseDance</div>
            <div class="logo-sub">music player</div>
        </div>

        <!-- 🔵 GOOGLE КНОПКА -->
        <button type="button" class="btn-google" id="googleBtn">
            <svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/>
                <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
                <path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.3C29.2 35 26.7 36 24 36c-5.2 0-9.6-3.1-11.3-7.7l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
                <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.3 5.3C41.6 35.7 44 30.4 44 24c0-1.3-.1-2.3-.4-3.5z"/>
            </svg>
            <span>Продолжить с Google</span>
        </button>

        <div class="divider">или по email</div>

        <div class="tabs">
            <button class="tab-btn active" id="loginTab">Вход</button>
            <button class="tab-btn" id="registerTab">Регистрация</button>
        </div>

        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>

        <!-- Форма входа -->
        <form class="form" id="loginForm">
            <div class="input-group">
                <label>Email</label>
                <div class="input-wrapper">
                    <span class="input-icon">📧</span>
                    <input type="email" id="loginEmail" placeholder="your@email.com" autocomplete="email" required>
                </div>
            </div>
            <div class="input-group">
                <label>Пароль</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required>
                </div>
            </div>
            <button type="submit" class="btn-primary" id="loginBtn">
                <span>Войти</span>
                <span style="font-size: 1.1rem;">→</span>
            </button>
        </form>

        <!-- Форма регистрации -->
        <form class="form" id="registerForm">
            <div class="input-group">
                <label>Имя пользователя</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input type="text" id="registerName" placeholder="muse_lover" autocomplete="username" required>
                </div>
            </div>
            <div class="input-group">
                <label>Email</label>
                <div class="input-wrapper">
                    <span class="input-icon">📧</span>
                    <input type="email" id="registerEmail" placeholder="your@email.com" autocomplete="email" required>
                </div>
            </div>
            <div class="input-group">
                <label>Пароль (минимум 6 символов)</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="registerPassword" placeholder="••••••••" autocomplete="new-password" required minlength="6">
                </div>
            </div>
            <button type="submit" class="btn-primary" id="registerBtn">
                <span>Создать аккаунт</span>
                <span style="font-size: 1.1rem;">✨</span>
            </button>
        </form>

        <div class="extra">
            <a id="forgotPassword">Забыли пароль?</a>
        </div>
    </div>

    <!-- ЭКРАН ПЛЕЕРА -->
    <div class="card" id="playerScreen">
        <div class="user-avatar" id="userAvatar">?</div>
        <div class="greeting" id="userGreeting">Привет!</div>
        <div class="user-email" id="userEmail">email</div>
        <div class="provider-badge" id="providerBadge">
            <span id="providerIcon">📧</span>
            <span id="providerText">Email/Password</span>
        </div>

        <div class="player-box">
            <div class="player-track">🎵 Midnight Vibes</div>
            <div class="player-artist">MuseDance Radio</div>
            <div class="player-progress">
                <div class="player-progress-bar"></div>
            </div>
            <div class="player-controls">
                <span>⏮️</span>
                <span>⏸️</span>
                <span>⏭️</span>
            </div>
        </div>

        <button class="btn-secondary" id="logoutBtn" style="width: 100%;">
            Выйти
        </button>
    </div>

    <!-- 🔥 Firebase SDK v10 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            signInWithPopup,
            GoogleAuthProvider,
            signOut,
            onAuthStateChanged,
            updateProfile,
            sendPasswordResetEmail
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        // ----- Твой конфиг -----
        const firebaseConfig = {
            apiKey: "AIzaSyCUAzpzwQDlnYatI4-4fIjVm76qBzCPFuk",
            authDomain: "musedance-3da1d.firebaseapp.com",
            projectId: "musedance-3da1d",
            storageBucket: "musedance-3da1d.firebasestorage.app",
            messagingSenderId: "203743228849",
            appId: "1:203743228849:web:f1c52da18f2294085f8390",
            measurementId: "G-8RDF6JH4SY"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        // Хотим всегда показывать выбор аккаунта (не авто-вход)
        googleProvider.setCustomParameters({ prompt: 'select_account' });

        // ----- DOM -----
        const authScreen = document.getElementById('authScreen');
        const playerScreen = document.getElementById('playerScreen');
        const loginTab = document.getElementById('loginTab');
        const registerTab = document.getElementById('registerTab');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');
        const googleBtn = document.getElementById('googleBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const forgotPassword = document.getElementById('forgotPassword');

        // ----- Утилиты -----
        function showError(text) {
            errorMsg.textContent = '⚠️ ' + text;
            errorMsg.classList.add('show');
            successMsg.classList.remove('show');
            setTimeout(() => errorMsg.classList.remove('show'), 6000);
        }

        function showSuccess(text) {
            successMsg.textContent = '✅ ' + text;
            successMsg.classList.add('show');
            errorMsg.classList.remove('show');
            setTimeout(() => successMsg.classList.remove('show'), 6000);
        }

        function setLoading(btn, isLoading, textLoading = 'Загрузка') {
            if (isLoading) {
                btn.disabled = true;
                btn.dataset.origText = btn.innerHTML;
                btn.innerHTML = `<span>${textLoading}...</span>`;
            } else {
                btn.disabled = false;
                if (btn.dataset.origText) btn.innerHTML = btn.dataset.origText;
            }
        }

        // ----- Перевод ошибок Firebase -----
        function translateError(code) {
            const map = {
                'auth/email-already-in-use': 'Этот email уже зарегистрирован. Попробуйте войти или используйте Google.',
                'auth/invalid-email': 'Некорректный email.',
                'auth/weak-password': 'Пароль слишком слабый (минимум 6 символов).',
                'auth/user-not-found': 'Пользователь с таким email не найден.',
                'auth/wrong-password': 'Неверный пароль.',
                'auth/invalid-credential': 'Неверный email или пароль.',
                'auth/too-many-requests': 'Слишком много попыток. Попробуйте позже.',
                'auth/network-request-failed': 'Ошибка сети. Проверьте интернет.',
                'auth/popup-closed-by-user': 'Окно входа закрыто.',
                'auth/popup-blocked': 'Браузер заблокировал всплывающее окно. Разрешите попапы для этого сайта.',
                'auth/cancelled-popup-request': 'Запрос отменён.',
                'auth/unauthorized-domain': 'Домен не авторизован в Firebase Console.',
                'auth/operation-not-allowed': 'Этот способ входа отключён в Firebase Console.',
                'auth/account-exists-with-different-credential': 'Этот email уже зарегистрирован другим способом (например, паролем). Войдите паролем или свяжите аккаунты.',
                'auth/missing-password': 'Введите пароль.'
            };
            return map[code] || 'Ошибка: ' + code;
        }

        // ----- Переключение вкладок -----
        function showLogin() {
            loginTab.classList.add('active');
            registerTab.classList.remove('active');
            loginForm.style.display = 'flex';
            registerForm.style.display = 'none';
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');
        }

        function showRegister() {
            registerTab.classList.add('active');
            loginTab.classList.remove('active');
            loginForm.style.display = 'none';
            registerForm.style.display = 'flex';
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');
        }

        loginTab.addEventListener('click', showLogin);
        registerTab.addEventListener('click', showRegister);

        // ----- 🔵 GOOGLE SIGN-IN -----
        googleBtn.addEventListener('click', async () => {
            setLoading(googleBtn, true, 'Открытие Google');
            try {
                const result = await signInWithPopup(auth, googleProvider);
                const user = result.user;
                // Если это первый вход — Firebase сам создаёт аккаунт
                showSuccess(`Добро пожаловать, ${user.displayName || user.email}! 🎉`);
                // onAuthStateChanged переключит экран
            } catch (err) {
                console.error('Google sign-in error:', err);
                if (err.code !== 'auth/popup-closed-by-user' && err.code !== 'auth/cancelled-popup-request') {
                    showError(translateError(err.code));
                }
            } finally {
                setLoading(googleBtn, false);
            }
        });

        // ----- РЕГИСТРАЦИЯ -----
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('registerName').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value;

            if (!name || !email || !password) {
                showError('Заполните все поля');
                return;
            }

            setLoading(registerBtn, true, 'Создание');
            try {
                const cred = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(cred.user, { displayName: name });
                showSuccess('Аккаунт создан! Добро пожаловать 🎉');
            } catch (err) {
                console.error(err);
                showError(translateError(err.code));
            } finally {
                setLoading(registerBtn, false);
            }
        });

        // ----- ВХОД -----
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showError('Заполните все поля');
                return;
            }

            setLoading(loginBtn, true, 'Вход');
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (err) {
                console.error(err);
                showError(translateError(err.code));
            } finally {
                setLoading(loginBtn, false);
            }
        });

        // ----- СБРОС ПАРОЛЯ -----
        forgotPassword.addEventListener('click', async (e) => {
            e.preventDefault();
            const email = prompt('Введите email для сброса пароля:');
            if (!email) return;
            try {
                await sendPasswordResetEmail(auth, email.trim());
                showSuccess('Письмо для сброса пароля отправлено на ' + email);
            } catch (err) {
                console.error(err);
                showError(translateError(err.code));
            }
        });

        // ----- ВЫХОД -----
        logoutBtn.addEventListener('click', async () => {
            await signOut(auth);
        });

        // ----- ОТСЛЕЖИВАНИЕ СОСТОЯНИЯ -----
        onAuthStateChanged(auth, (user) => {
            if (user) {
                authScreen.style.display = 'none';
                playerScreen.style.display = 'block';

                const name = user.displayName || user.email.split('@')[0];

                // Аватар: если Google дал photoURL — показываем картинку
                const avatarEl = document.getElementById('userAvatar');
                if (user.photoURL) {
                    avatarEl.innerHTML = `<img src="${user.photoURL}" alt="avatar">`;
                } else {
                    avatarEl.textContent = name[0].toUpperCase();
                }

                document.getElementById('userGreeting').textContent = 'Привет, ' + name + '! 👋';
                document.getElementById('userEmail').textContent = user.email;

                // Показываем каким способом вошёл
                const isGoogle = user.providerData.some(p => p.providerId === 'google.com');
                document.getElementById('providerIcon').textContent = isGoogle ? '🔵' : '📧';
                document.getElementById('providerText').textContent = isGoogle
                    ? 'Вход через Google'
                    : 'Email и пароль';
            } else {
                authScreen.style.display = 'block';
                playerScreen.style.display = 'none';
                loginForm.reset();
                registerForm.reset();
            }
        });
    </script>
</body>
</html>
